model:
  arch: mini_gpt4rec_v2 # by default
  model_type: pretrain_vicuna
  freeze_rec: False  #
  freeze_proj: False #
  freeze_lora: False #
  max_txt_len: 1024 # by default
  proj_token_num: 1 # default:1
  proj_drop: 0 # by default
  proj_mid_times: 10 # proj_mid_times * rec embedding size = the middle layer size of the mapping module
  end_sym: "###"
  prompt_path: "prompts/collm_movie.txt"
  prompt_template: '{}'
  llama_model: "/home/bbx/user_lx/models/vicuna-7b-v0" #vicuna path
  user_num: -100
  item_num: -100
  lora_gnn: "ngcf"
  lora_scale: 1.0
  gnn_scale: 0.1
  gcn_layer: 31
  # ---- DIAGNOSTIC: loop ON at eval ----
  semantic_feedback: True
  semantic_layer: 8
  feedback_detach: False
  feedback_gate_bias_init: -2.0
  dataset: movie
  ans_type: 'v2' # by default
  rec_model: "MF"
  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"]
    dropout: 0.05
  rec_config:
    user_num: -100
    item_num: -100
    embedding_size: 256 #embedding size
    pretrained_path: /home/bbx/user_lx/GraphLoRA/checkpoints/0912_ml1m_oodv2_best_model_d256lr-0.001wd0.0001.pth

  # diagnostic target: final gentle-ft epoch, loop at its most-open state
  ckpt: /home/bbx/user_lx/GraphLoRA/output/graphlora_ml1m_biloop_ft/20260905154/checkpoint_14.pth

datasets:
  amazon_ood:
    path: /home/bbx/user_lx/GraphLoRA/dataset/ml-1m/
    train_file: train_ood2.pkl
    val_file: valid_ood2.pkl
    test_file: test_ood2.pkl
    data_type: default
    build_info:
      storage: /home/bbx/user_lx/GraphLoRA/dataset/ml-1m/

run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 8e-5
  warmup_lr: 1e-5
  mode: 'v2'

  weight_decay: 1e-3
  max_epoch: 500
  iters_per_epoch: 1000
  batch_size_train: 1
  batch_size_eval: 4
  num_workers: 0
  warmup_steps: 200

  seed: 42
  output_dir: /home/bbx/user_lx/GraphLoRA/output/graphlora_ml1m_biloop_ft_diag_on

  amp: True
  resume_ckpt_path: null

  evaluate: True # evaluation only
  train_splits: ["train"]
  valid_splits: ["valid"]
  test_splits: ["valid"] # DIAGNOSTIC: score the valid split (e14 loop-on reference was 0.6934)

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
