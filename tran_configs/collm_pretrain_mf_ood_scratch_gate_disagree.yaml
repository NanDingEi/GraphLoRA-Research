model:
  arch: mini_gpt4rec_v2 # by default
  model_type: pretrain_vicuna
  freeze_rec: False  #
  freeze_proj: False #
  freeze_lora: False #
  max_txt_len: 1024 # by default
  proj_token_num: 1 # default:1,  the number of text token embeddings that the A single ID embedding is converted into
  proj_drop: 0 # by default
  proj_mid_times: 10 # proj_mid_times * rec embedding size = the middle layer size of the mapping module
  end_sym: "###"
  prompt_path: "prompts/collm_movie_idlist.txt"
  prompt_template: '{}'
  llama_model: "/home/bbx/user_lx/models/vicuna-7b-v0" #vicuna path
  user_num: -100
  item_num: -100
  lora_gnn: "ngcf"  # 'lightgcn', 'ngcf', 'graphsage', 'gat' , 'gcn'
  lora_scale: 1.0
  gnn_scale: 0.1
  gcn_layer: 31
  # ---- B3: bidirectional relational mutual learning (LLM <-> GNN) ----
  # LLM view: hs[mutual_layer] at ID-token positions (pass-1, training only)
  # GNN view: penultimate 256-d NGCF embedding
  # batch-wide user->item relation matching with stop-grad teacher per
  # direction (batch must be >= 2 so there are >= 2 candidate items):
  #   L = L_rec + lambda_llm_to_gnn * hinge_rank(sg(LLM order) || GNN gaps)
  #           + lambda_gnn_to_llm * hinge_rank(sg(GNN order) || LLM gaps)
  # v3: hinge ranking instead of KL — KL's absolute-confidence matching warped
  # the LLM geometry once orderings agreed and collapsed valid AUC (see
  # experiments_journal.md); the hinge is exactly zero once both views agree
  # with rank_margin, so it cannot grind representations apart.
  # no new parameters -> warm start is lossless
  semantic_feedback: False   # mutually exclusive with mutual_mode
  mutual_mode: "b3"          # "off" | "b2" | "b3"
  mutual_layer: 8            # l_s: pass-1 depth, must be < gcn_layer
  lambda_llm_to_gnn: 0.5    # ranking hinge is ~100x smaller than KL; rescaled to match v2 good-phase contribution
  lambda_gnn_to_llm: 2.0    # keeps v2 4:1 asymmetry (G->L stronger)
  rel_temp_llm: 0.05  # sharpened: raw cos gap is only ~0.03-0.05, T=1 flattens P to near-uniform
  rel_temp_gnn: 0.05        # unused in rank mode (kept for reference)
  mutual_rank_loss: True   # v3 fix: hinge ranking instead of KL (scale-free, self-terminating)
  rank_margin: 0.02
  rank_weight_ref: 0.05
  mutual_warmup_iters: 0
  mutual_gate: "disagreement" # scheme 4: transfer only when views disagree  # B11: transfer only when one side is confident
  gate_tau_high: 0.75
  gate_tau_low: 0.6
  gnn_conf_kappa: 5.0
  gnn_conf_loss_weight: 0.1
  dataset: movie
  ans_type: 'v2' # by default
  rec_model: "MF" #[MF, lightgcn,.....], see "Rec2Base" class in  minigpt4/models/rec_model.py
  lora_config:
    use_lora: True
    r: 8
    alpha: 16
    target_modules: ["q_proj", "v_proj"] # ,"k_proj","up_proj","down_proj"
    dropout: 0.05
  rec_config: # recommender model config
    user_num: -100
    item_num: -100
    embedding_size: 256 #embedding size
    pretrained_path: /home/bbx/user_lx/GraphLoRA/checkpoints/0912_ml1m_oodv2_best_model_d256lr-0.001wd0.0001.pth

  # warm start from the trained GraphLoRA baseline checkpoint; B3 adds no new
  # parameters, so strict=False should show NO missing/unexpected keys
  ckpt: null # scratch run (warm-start ckpt cleaned)


datasets:
  amazon_ood:
    path: /home/bbx/user_lx/GraphLoRA/dataset/ml-1m/
    train_file: train_ood2.pkl
    val_file: valid_ood2.pkl
    test_file: test_ood2.pkl
    data_type: default
    build_info:
      storage: /home/bbx/user_lx/GraphLoRA/dataset/ml-1m/

run:
  task: rec_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4 # from-scratch run
  min_lr: 5e-5
  warmup_lr: 1e-5
  mode: 'v2' # always, please not change it


  weight_decay: 1e-3 # by default
  max_epoch: 500
  iters_per_epoch: 1000 #100
  batch_size_train: 2 # shared GPU: batch=3 leaves only 2GB headroom, co-tenant processes cause OOM
  batch_size_eval: 4 # 32
  num_workers: 0
  warmup_steps: 200

  seed: 42
  output_dir: /home/bbx/user_lx/GraphLoRA/output/graphlora_ml1m_scratch_gate #log and model saving path
  save_checkpoint_every_n_epochs: 1 # debug: lightweight per-epoch snapshot (~100MB, trainable params only)

  amp: True
  resume_ckpt_path: null

  evaluate: False # False: training, True: only evaluation
  train_splits: ["train"]
  valid_splits: ["valid"] # validation set
  test_splits: ["test"] # ,,"test", "valid", "test_warm" ,"test_cold" ,

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: False
