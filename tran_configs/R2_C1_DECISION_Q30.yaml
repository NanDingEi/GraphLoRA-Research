# GraphLoRA R2 controlled comparison: fresh LLM LoRA+Projector (epoch0),
# S2 pretrained MF/NGCF restored and frozen. Train/eval normalized GNN parity.
# fixed batch=2, accum=4, 2 epochs, Lora baseLR8e-5 / projection 6e-5.
model:
  ans_type: v2
  arch: mini_gpt4rec_v2
  ckpt: null
  d1_small_ckpt: /home/bbx/user_lx/GraphLoRA/output/S2_groups_acc3/20261010223/checkpoint_best.pth
  d1_mode: decision_q_v
  d1_freeze_small: true
  d1_q_scale: 30.0
  d1_pair_init_std: 0.02
  d1_gcn_eval_match_train: true
  grad_clip: 1.0
  dataset: movie
  end_sym: '###'
  freeze_lora: false
  freeze_proj: false
  freeze_rec: false
  gcn_layer: 31
  gnn_scale: 0.1
  gnn_semantic_align: false
  gnn_semantic_weight: 0.0001
  item_num: -100
  llama_model: /home/bbx/user_lx/models/vicuna-7b-v0
  lora_config:
    alpha: 16
    dropout: 0.05
    r: 8
    target_modules:
    - q_proj
    - v_proj
    use_lora: true
  lora_gnn: ngcf
  lora_scale: 1.0
  max_txt_len: 1024
  model_type: pretrain_vicuna
  proj_drop: 0
  proj_mid_times: 10
  proj_reg_items: 64
  proj_reg_weight: 0.0005
  proj_token_num: 1
  prompt_path: prompts/collm_movie_idlist.txt
  prompt_template: '{}'
  rec_config:
    embedding_size: 256
    item_num: 3256
    pretrained_path: /home/bbx/user_lx/GraphLoRA/checkpoints/0912_ml1m_oodv2_best_model_d256lr-0.001wd0.0001.pth
    user_num: 839
  rec_model: MF
  train_gnn_with_rec_loss: false
  user_num: -100
datasets:
  amazon_ood:
    build_info:
      storage: /home/bbx/user_lx/GraphLoRA/dataset/ml-1m/
    data_type: default
    path: /home/bbx/user_lx/GraphLoRA/dataset/ml-1m/
    test_file: test_ood2.pkl
    train_file: train_ood2.pkl
    val_file: valid_ood2.pkl
run:
  accum_grad_iters: 4
  amp: true
  batch_size_eval: 2
  batch_size_train: 2
  device: cuda
  dist_url: env://
  distributed: false
  evaluate: false
  init_lr: 8.0e-05
  lr_scale_gnn: 0.25
  lr_scale_lora: 1
  lr_scale_proj: 0.75
  lr_scale_rec: 0.5
  lr_sched: linear_warmup_cosine_lr
  max_epoch: 2
  min_lr: 1.0e-05
  mode: v2
  num_workers: 0
  output_dir: output/R2_C1_DECISION_Q30
  resume_ckpt_path: null
  save_checkpoint_every_n_epochs: 1
  seed: 42
  task: rec_pretrain
  test_splits:
  - test
  train_splits:
  - train
  valid_splits:
  - valid
  warmup_lr: 5.0e-06
  warmup_steps: 100
  weight_decay: 0.001
  world_size: 1
